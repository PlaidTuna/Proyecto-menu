<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedido</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>

        <h1>Realiza tu Pedido</h1>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="menu.html">Menú</a>
            <a href="pedido.html">Pedido</a>
        </nav>

    </header>


    <!-- formulario -->
    <section class="contacto">

        <h2>Formulario de Pedido</h2>

        <form id="formularioPedido">

            <!-- nombre -->
            <input 
                type="text" 
                id="nombre"
                placeholder="Nombre"
            >

            <!-- correo -->
            <input 
                type="email"
                id="correo"
                placeholder="Correo"
            >

            <!-- seleccionar pizza  el multi opcines-->
            <select id="pizza">

                <option value="">
                    Selecciona una pizza
                </option>

                <option value="Pepperoni">
                    Pizza Pepperoni
                </option>

                <option value="Hawaiana">
                    Pizza Hawaiana
                </option>

                <option value="Especial">
                    Pizza Especial
                </option>

            </select>


            <!-- indicaciones en caso de que a la pizza se le quiera pedir algo mas o menos -->
            <textarea 
                id="indicaciones"
                placeholder="Indicaciones adicionales"
            ></textarea>


            <button 
                type="button"
                onclick="enviarFormulario()"
            >
                Enviar Pedido
            </button>

        </form>

    </section>


    <footer>
        <p>Pizza Express - 2026</p>
    </footer>

<!-- sin esto no funciona lo de arriba --> 
    <script src="script.js"></script>

</body>

</html>
